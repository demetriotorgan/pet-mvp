<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetAlerta - Encontre seu Amigo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">PetAlerta</div>
        <nav>
            <a href="#mural">Ver Animais</a>
            <a href="#cadastro" class="btn-nav">Anunciar Pet</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Ajude a reencontrar quem espalha amor</h1>
        <p>Preencha os dados abaixo para registrar um animal perdido, encontrado ou disponível para adoção.</p>
    </section>

    <div class="container">

        <section id="cadastro" class="card-form">
            <h2>Cadastrar Animal</h2>
            <form id="petForm">
                <div class="form-group">
                    <label for="petName">Nome do Pet (se souber):</label>
                    <input type="text" id="petName" placeholder="Ex: Bob, Mel...">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="petType">Tipo de Animal:</label>
                        <select id="petType" required>
                            <option value="Cachorro">Cachorro</option>
                            <option value="Gato">Gato</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="petStatus">Status:</label>
                        <select id="petStatus" required>
                            <option value="Perdido">Perdido</option>
                            <option value="Encontrado">Encontrado</option>
                            <option value="Adocao">Para Adoção</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="petLocation">Endereço ou Bairro de referência:</label>
                    <input type="text" id="petLocation" placeholder="Ex: Centro, próximo ao banco" required>
                </div>

                <div class="form-group">
                    <label for="petContact">Telefone de Whatssapp:
                    </label>
                    <input type="tel" id="petContact" placeholder="Ex: 11999999999" required>
                </div>

                <div class="form-group">
                    <label>Escolha como adicionar a foto:</label>
                    <div class="botoes-foto-container">

                        <button type="button" id="botaoCamera" class="btn-camera-container">
                            <span class="icon-camera">📷</span>
                            <span class="text-camera">Tirar foto agora</span>
                        </button>

                        <label for="petGalleryFile" class="btn-camera-container">
                            <span class="icon-camera">📁</span>
                            <span class="text-camera">Escolher da galeria</span>
                            <input type="file" id="petGalleryFile" accept="image/*">
                        </label>
                    </div>

                    <!-- Área da câmera -->
                    <div id="cameraContainer" class="camera-container">

                        <video id="video" autoplay playsinline width="300"></video>
                        <canvas id="canvas"></canvas>

                        <small>Botões de Teste</small>
                        <button id="capturar">Capturar</button>
                        <button id="enviar">Enviar</button>
                        <button id="cancelar">Cancelar</button>
                    </div>

                    <hr>
                    <h2>Galeria</h2>
                    <div id="galeria"></div>
                </div>

                <button type="submit" class="btn-submit">Cadastrar Animal</button>
            </form>
        </section>

        <main id="mural" class="mural-grid">
        </main>
    </div>

    <script type="module" src="/script.js"></script>
</body>

</html>
